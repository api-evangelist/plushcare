aid: plushcare
name: PlushCare
description: 'PlushCare is a direct-to-consumer telehealth and virtual primary care
  service that connects patients with board-certified physicians for online doctor
  visits, available 24/7 across all 50 US states. Services include online prescriptions
  and refills, urgent care video visits, mental health care and therapy, weight-loss
  management including GLP-1 medications, chronic disease management, pediatric and
  preventive care, and sexual health. Founded in 2014 in San Francisco by Dr. James
  Wantuck and Ryan McQuaid, PlushCare accepts most major insurance and sells a $19.99/month
  patient membership. Ownership has changed three times: Accolade acquired PlushCare
  in 2021, Transcarent acquired Accolade in 2025, and effective 2026-07-31 PlushCare,
  Inc. became a subsidiary of Fabric Labs, Inc. As a consumer telehealth service,
  PlushCare publishes no public developer API, developer portal, API reference, SDK,
  MCP server or agent card; its one live API host, api.plushcare.com, is the patient
  app''s own private Django REST Framework backend and returns 403 anonymously. This
  profile captures its public web, pricing, compliance and domain-security surface.'
