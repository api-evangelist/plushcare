aid: plushcare
name: PlushCare
description: 'PlushCare is a telehealth and virtual primary care platform that connects
  patients with board-certified physicians for online doctor visits, available 24/7
  across all 50 US states. Services include online prescriptions and refills, urgent
  care video visits, mental health care and therapy, weight-loss management including
  GLP-1 medications, chronic disease management, pediatric and preventive care, and
  sexual health. Founded in 2014 and headquartered in San Francisco, PlushCare accepts
  most major insurance and offers self-pay memberships. It was surfaced as a portfolio
  company of GGV Capital and Lightspeed Venture Partners. As a consumer telehealth
  service, PlushCare publishes no public developer API, developer portal, or SDKs;
  this profile captures its public web and domain-security surface.'
