source: live probes of status.plushcare.com, plushcare.com and api.plushcare.com
note: >-
  PlushCare publishes no API, so there is no API versioning policy, no deprecation
  policy and no SLA to record. The one lifecycle surface that exists is an
  Atlassian Statuspage that the company PROVISIONED BUT NEVER TURNED ON —
  status.plushcare.com resolves and 302s to https://plushcare1.statuspage.io,
  which lands on /inactive with the title "PlushCare Status - Page Inactive" and
  the body "This page is currently inactive and can only be viewed by team
  members." Because the page serves no status to the public, NO `StatusPage`
  pointer is emitted in apis.yml, and no `Deprecation` pointer either. This file
  records the absence and the reason.
